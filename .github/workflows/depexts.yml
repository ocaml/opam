name: depexts

on:
  pull_request:
    paths:
      - '*.opam'
      - 'src/state/opamSysInteract.ml'
      - 'src/state/opamSysPoll.ml'
      - '.github/workflows/depexts.yml'
      - '.github/scripts/depexts/**'
  push:
    branches:
      - 'master'
      - '2.**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  OPAM_REPO: https://github.com/ocaml/opam-repository.git
  OPAM_REPO_SHA: 3c79a939b221caf909b254fdff9616f8c0266e4f

jobs:
  depexts-alpine:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: generate action
      run: |
        bash .github/scripts/depexts/generate-actions.sh alpine
    - name: depexts actions alpine
      uses: ./.github/actions/alpine
      id: depexts-alpine

  depexts-altlinux:
